name: Build - SkiaSharp & HarfBuzzSharp Static Libraries

on:
  workflow_dispatch:
    inputs:
      avalonia_version:
        description: "Avalonia Version (e.g. 12.1.2)"
        required: true
        default: "12.1.2"
        type: string
      skiasharp_version:
        description: "SkiaSharp Version (e.g. 3.119.4)"
        required: true
        default: "3.119.4"
        type: string
      skiasharp_ref:
        description: "SkiaSharp git branch or tag in mono/SkiaSharp (e.g. release/3.119.4)"
        required: true
        default: "release/3.119.4"
        type: string
      harfbuzz_version:
        description: "HarfBuzzSharp Version (e.g. 8.3.1.3)"
        required: false
        default: "8.3.1.3"
        type: string
      revision:
        description: "Package revision suffix (e.g. r1, r2, leave empty for base version)"
        required: false
        default: "r1"
        type: string
      package_id:
        description: "NuGet Package ID"
        required: false
        default: "Summpot.SkiaSharp.Static"
        type: string
      publish_release:
        description: "Create GitHub Release and attach assets"
        required: false
        default: true
        type: boolean
      publish_nuget:
        description: "Publish NuGet package to NuGet.org via Trusted Publishing"
        required: false
        default: true
        type: boolean
      nuget_user:
        description: "NuGet.org username for Trusted Publishing"
        required: false
        default: "Summpot"
        type: string
      skip_native_builds:
        description: "Skip native builds (reuse existing release assets for quick re-pack/publish)"
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      avalonia_version:
        required: true
        type: string
      skiasharp_version:
        required: true
        type: string
      skiasharp_ref:
        required: true
        type: string
      harfbuzz_version:
        required: false
        default: "8.3.1.3"
        type: string
      revision:
        required: false
        default: "r1"
        type: string
      package_id:
        required: false
        default: "Summpot.SkiaSharp.Static"
        type: string
      publish_release:
        required: false
        default: true
        type: boolean
      publish_nuget:
        required: false
        default: true
        type: boolean
      nuget_user:
        required: false
        default: "Summpot"
        type: string
      skip_native_builds:
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  resolve-source:
    name: Resolve upstream source
    if: ${{ !inputs.skip_native_builds }}
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: resolve
        env:
          SKIASHARP_REF: ${{ inputs.skiasharp_ref }}
        run: python scripts/upstream.py resolve "$SKIASHARP_REF"

  build-windows:
    name: Windows ${{ matrix.arch }} (Static)
    needs: resolve-source
    if: ${{ !inputs.skip_native_builds }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            msvc_arch: x64
            msbuild_platform: x64
          # Cross-compile from the x64 runner. Skia GN selects HostX64/<target_cpu>/cl.exe.
          - arch: arm64
            msvc_arch: amd64_arm64
            msbuild_platform: ARM64
            platform_toolset: v143
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup depot_tools
        shell: pwsh
        run: |
          git clone --depth=1 --no-tags --single-branch https://chromium.googlesource.com/chromium/tools/depot_tools.git "$env:USERPROFILE\depot_tools"
          "$env:USERPROFILE\depot_tools" | Out-File -FilePath $env:GITHUB_PATH -Append
          "DEPOT_TOOLS_WIN_TOOLCHAIN=0" | Out-File -FilePath $env:GITHUB_ENV -Append
          $env:PATH = "$env:USERPROFILE\depot_tools;$env:PATH"
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global depot-tools.allowGlobalGitConfig true
          & "$env:USERPROFILE\depot_tools\update_depot_tools.bat"

      - name: Setup MSVC environment
        uses: TheMrMilchmann/setup-msvc-dev@v3
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Fetch SkiaSharp source
        shell: pwsh
        run: |
          $skiaRef = "${{ needs.resolve-source.outputs.commit }}"
          Write-Host "Fetching SkiaSharp source from $skiaRef..."
          New-Item -ItemType Directory -Path "src_skiasharp" -Force | Out-Null
          Set-Location src_skiasharp
          git init
          git remote add upstream https://github.com/mono/SkiaSharp.git
          git fetch --depth 1 upstream "$skiaRef"
          git checkout -q FETCH_HEAD
          git submodule update --init --depth 1 externals/skia
          Set-Location ..

      - name: Sync Skia dependencies
        shell: pwsh
        run: |
          Set-Location src_skiasharp/externals/skia
          python tools/git-sync-deps
          Set-Location ../../

      - name: Apply source patches
        run: python scripts/upstream.py apply

      - name: Build Skia & SkiaSharp (Static)
        shell: pwsh
        run: |
          $buildDir = "out/win-${{ matrix.arch }}"
          New-Item -ItemType Directory -Path $buildDir -Force | Out-Null
          (Get-Content "native/static/args.win.gn") -replace 'target_cpu = "x64"', 'target_cpu = "${{ matrix.arch }}"' | Set-Content "$buildDir/args.gn" -Encoding ascii
          $buildDirAbs = (Resolve-Path $buildDir).Path
          Set-Location src_skiasharp/externals/skia
          gn gen "$buildDirAbs"
          autoninja -C "$buildDirAbs" skia SkiaSharp
          Set-Location ../../

      - name: Build libHarfBuzzSharp (Static)
        shell: pwsh
        run: |
          $buildDirAbs = (Resolve-Path "out/win-${{ matrix.arch }}").Path
          $msbuildArgs = @(
            "src_skiasharp/native/windows/libHarfBuzzSharp/libHarfBuzzSharp.vcxproj",
            "-m",
            "-t:rebuild",
            "-p:Configuration=Release",
            "-p:Platform=${{ matrix.msbuild_platform }}",
            "-p:ConfigurationType=StaticLibrary",
            "-p:OutDir=$buildDirAbs\"
          )
          $toolset = "${{ matrix.platform_toolset }}"
          if ($toolset) {
            $msbuildArgs += "-p:PlatformToolset=$toolset"
          }
          & msbuild @msbuildArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare Windows artifacts
        shell: pwsh
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          python -c @'
          import os, pathlib, sys
          arch = os.environ["ARCH"]
          expected = {"x64": 0x8664, "arm64": 0xAA64}[arch]
          known = {0x8664, 0xAA64, 0x14C, 0x1C0}
          for name in ("skia.lib", "SkiaSharp.lib", "libHarfBuzzSharp.lib"):
              data = pathlib.Path(f"out/win-{arch}", name).read_bytes()
              if not data.startswith(b"!<arch>\n"):
                  sys.exit(f"{name} is not a COFF archive")
              pos = 8
              machine = None
              while pos + 60 <= len(data):
                  header = data[pos:pos + 60]
                  member_name = header[:16].decode("ascii", "replace").strip()
                  size = int(header[48:58])
                  member = pos + 60
                  if member_name not in ("/", "//") and member + 8 <= len(data):
                      if data[member:member + 4] == b"\x00\x00\xff\xff":
                          candidate = int.from_bytes(data[member + 6:member + 8], "little")
                      else:
                          candidate = int.from_bytes(data[member:member + 2], "little")
                      if candidate in known:
                          machine = candidate
                          break
                  pos = member + size + (size % 2)
              if machine != expected:
                  sys.exit(f"{name} COFF machine {machine}, expected {expected:#x} for {arch}")
              print(f"{name} COFF machine {machine:#x} matches {arch}")
          '@
          $out = "out/win-$env:ARCH"
          New-Item -ItemType Directory -Path "artifacts/win-$env:ARCH" -Force | Out-Null
          Copy-Item "$out/skia.lib" "artifacts/win-$env:ARCH/"
          Copy-Item "$out/SkiaSharp.lib" "artifacts/win-$env:ARCH/"
          Copy-Item "$out/libHarfBuzzSharp.lib" "artifacts/win-$env:ARCH/"
          if (Test-Path "$out/libHarfBuzzSharp.pdb") {
            Copy-Item "$out/libHarfBuzzSharp.pdb" "artifacts/win-$env:ARCH/"
          }
          Compress-Archive -Path "artifacts/win-$env:ARCH/*" -DestinationPath "SkiaSharp.Static-win-$env:ARCH.zip"

      - name: Upload Windows native binaries
        uses: actions/upload-artifact@v4
        with:
          name: native-win-${{ matrix.arch }}
          path: artifacts/win-${{ matrix.arch }}/

      - name: Upload Windows archive
        uses: actions/upload-artifact@v4
        with:
          name: archive-win-${{ matrix.arch }}
          path: SkiaSharp.Static-win-${{ matrix.arch }}.zip

  build-linux:
    name: Linux ${{ matrix.arch }} (Static)
    needs: resolve-source
    if: ${{ !inputs.skip_native_builds }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libc++-dev libc++abi-dev ninja-build libfontconfig1-dev libfreetype-dev

      - name: Setup depot_tools
        run: |
          git clone --depth=1 --no-tags --single-branch https://chromium.googlesource.com/chromium/tools/depot_tools.git "$HOME/depot_tools"
          echo "$HOME/depot_tools" >> $GITHUB_PATH
          export PATH="$HOME/depot_tools:$PATH"
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global depot-tools.allowGlobalGitConfig true
          update_depot_tools

      - name: Fetch SkiaSharp source
        run: |
          SKIA_REF="${{ needs.resolve-source.outputs.commit }}"
          echo "Fetching SkiaSharp source from $SKIA_REF..."
          mkdir -p src_skiasharp
          cd src_skiasharp
          git init
          git remote add upstream https://github.com/mono/SkiaSharp.git
          git fetch --depth 1 upstream "$SKIA_REF"
          git checkout -q FETCH_HEAD
          git submodule update --init --depth 1 externals/skia
          cd ..

      - name: Sync Skia dependencies
        run: |
          cd src_skiasharp/externals/skia
          python tools/git-sync-deps
          cd ../..

      - name: Apply source patches
        run: python scripts/upstream.py apply

      - name: Build Skia, SkiaSharp & HarfBuzzSharp (Static)
        run: |
          mkdir -p "out/linux-${{ matrix.arch }}"
          sed "s/target_cpu = \"x64\"/target_cpu = \"${{ matrix.arch }}\"/" native/static/args.linux.gn > "out/linux-${{ matrix.arch }}/args.gn"
          BUILD_DIR=$(realpath "out/linux-${{ matrix.arch }}")
          cd src_skiasharp/externals/skia
          gn gen "$BUILD_DIR"
          autoninja -C "$BUILD_DIR" skia SkiaSharp HarfBuzzSharp
          cd ../..

      - name: Prepare Linux artifacts
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          python3 -c '
          import os, pathlib, sys
          arch = os.environ["ARCH"]
          data = pathlib.Path(f"out/linux-{arch}/libskia.a").read_bytes()
          index = data.find(b"\x7fELF")
          machine = int.from_bytes(data[index + 18:index + 20], "little") if index >= 0 else None
          expected = {"x64": 62, "arm64": 183}[arch]
          if machine != expected:
              sys.exit(f"libskia.a ELF machine {machine}, expected {expected}")
          print(f"libskia.a ELF machine {machine} matches {arch}")
          '
          mkdir -p "artifacts/linux-$ARCH"
          cp "out/linux-$ARCH/libskia.a" "artifacts/linux-$ARCH/"
          cp "out/linux-$ARCH/libSkiaSharp.a" "artifacts/linux-$ARCH/"
          cp "out/linux-$ARCH/libHarfBuzzSharp.a" "artifacts/linux-$ARCH/"
          tar -czvf "SkiaSharp.Static-linux-$ARCH.tar.gz" -C "artifacts/linux-$ARCH" .

      - name: Upload Linux native binaries
        uses: actions/upload-artifact@v4
        with:
          name: native-linux-${{ matrix.arch }}
          path: artifacts/linux-${{ matrix.arch }}/

      - name: Upload Linux archive
        uses: actions/upload-artifact@v4
        with:
          name: archive-linux-${{ matrix.arch }}
          path: SkiaSharp.Static-linux-${{ matrix.arch }}.tar.gz

  build-macos:
    name: macOS arm64 & x64 (Static)
    needs: resolve-source
    if: ${{ !inputs.skip_native_builds }}
    runs-on: macos-latest
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup depot_tools
        run: |
          git clone --depth=1 --no-tags --single-branch https://chromium.googlesource.com/chromium/tools/depot_tools.git "$HOME/depot_tools"
          echo "$HOME/depot_tools" >> $GITHUB_PATH
          export PATH="$HOME/depot_tools:$PATH"
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global depot-tools.allowGlobalGitConfig true
          update_depot_tools

      - name: Fetch SkiaSharp source
        run: |
          SKIA_REF="${{ needs.resolve-source.outputs.commit }}"
          echo "Fetching SkiaSharp source from $SKIA_REF..."
          mkdir -p src_skiasharp
          cd src_skiasharp
          git init
          git remote add upstream https://github.com/mono/SkiaSharp.git
          git fetch --depth 1 upstream "$SKIA_REF"
          git checkout -q FETCH_HEAD
          git submodule update --init --depth 1 externals/skia
          cd ..

      - name: Sync Skia dependencies
        run: |
          cd src_skiasharp/externals/skia
          python tools/git-sync-deps
          cd ../..

      - name: Apply source patches
        run: python scripts/upstream.py apply

      - name: Build macOS arm64 (Static)
        run: |
          mkdir -p out/osx-arm64
          cp native/static/args.mac.gn out/osx-arm64/args.gn
          BUILD_DIR=$(realpath out/osx-arm64)
          cd src_skiasharp/externals/skia
          gn gen "$BUILD_DIR"
          autoninja -C "$BUILD_DIR" skia SkiaSharp HarfBuzzSharp
          cd ../..

      - name: Build macOS x64 (Static)
        run: |
          mkdir -p out/osx-x64
          sed 's/target_cpu = "arm64"/target_cpu = "x64"/' native/static/args.mac.gn > out/osx-x64/args.gn
          BUILD_DIR=$(realpath out/osx-x64)
          cd src_skiasharp/externals/skia
          gn gen "$BUILD_DIR"
          autoninja -C "$BUILD_DIR" skia SkiaSharp HarfBuzzSharp
          cd ../..

      - name: Prepare macOS artifacts
        run: |
          mkdir -p artifacts/osx-arm64 artifacts/osx-x64
          cp out/osx-arm64/libskia.a artifacts/osx-arm64/
          cp out/osx-arm64/libSkiaSharp.a artifacts/osx-arm64/
          cp out/osx-arm64/libHarfBuzzSharp.a artifacts/osx-arm64/

          cp out/osx-x64/libskia.a artifacts/osx-x64/
          cp out/osx-x64/libSkiaSharp.a artifacts/osx-x64/
          cp out/osx-x64/libHarfBuzzSharp.a artifacts/osx-x64/

          tar -czvf SkiaSharp.Static-osx.tar.gz -C artifacts .

      - name: Upload macOS native binaries
        uses: actions/upload-artifact@v4
        with:
          name: native-osx
          path: artifacts/

      - name: Upload macOS archive
        uses: actions/upload-artifact@v4
        with:
          name: archive-osx
          path: SkiaSharp.Static-osx.tar.gz

  package-and-release:
    name: Package NuGet & Publish Release
    needs: [resolve-source, build-windows, build-linux, build-macos]
    if: ${{ always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Prepare packaging environment
        run: |
          mkdir -p release-assets out/native

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Download Windows x64 native binaries
        if: ${{ !inputs.skip_native_builds }}
        uses: actions/download-artifact@v4
        with:
          name: native-win-x64
          path: out/native/win-x64

      - name: Download Windows arm64 native binaries
        if: ${{ !inputs.skip_native_builds }}
        uses: actions/download-artifact@v4
        with:
          name: native-win-arm64
          path: out/native/win-arm64

      - name: Download Linux x64 native binaries
        if: ${{ !inputs.skip_native_builds }}
        uses: actions/download-artifact@v4
        with:
          name: native-linux-x64
          path: out/native/linux-x64

      - name: Download Linux arm64 native binaries
        if: ${{ !inputs.skip_native_builds }}
        uses: actions/download-artifact@v4
        with:
          name: native-linux-arm64
          path: out/native/linux-arm64

      - name: Download macOS native binaries
        if: ${{ !inputs.skip_native_builds }}
        uses: actions/download-artifact@v4
        with:
          name: native-osx
          path: out/native/

      - name: Download archives
        if: ${{ !inputs.skip_native_builds }}
        uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: release-assets/
          merge-multiple: true

      - name: Compute package version and tags
        id: versioning
        run: |
          REV="${{ inputs.revision }}"
          if [ -n "$REV" ]; then
            PACKAGE_VER="${{ inputs.skiasharp_version }}-avalonia.${{ inputs.avalonia_version }}-$REV"
            TAG_NAME="avalonia-${{ inputs.avalonia_version }}-skia-${{ inputs.skiasharp_version }}-$REV"
          else
            PACKAGE_VER="${{ inputs.skiasharp_version }}-avalonia.${{ inputs.avalonia_version }}"
            TAG_NAME="avalonia-${{ inputs.avalonia_version }}-skia-${{ inputs.skiasharp_version }}"
          fi
          BASE_TAG="avalonia-${{ inputs.avalonia_version }}-skia-${{ inputs.skiasharp_version }}"
          echo "PACKAGE_VER=$PACKAGE_VER" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "BASE_TAG=$BASE_TAG" >> $GITHUB_ENV

      - name: Download existing release assets
        if: ${{ inputs.skip_native_builds }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Attempting to download native archives from release $TAG_NAME or $BASE_TAG..."
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release download "$TAG_NAME" --pattern "SkiaSharp.Static-*.zip" --pattern "SkiaSharp.Static-*.tar.gz" --dir release-assets || true
          fi
          if [ ! -f release-assets/SkiaSharp.Static-win-x64.zip ]; then
            echo "Falling back to downloading from base tag $BASE_TAG..."
            gh release download "$BASE_TAG" --pattern "SkiaSharp.Static-*.zip" --pattern "SkiaSharp.Static-*.tar.gz" --dir release-assets
          fi

          echo "Extracting downloaded native archives to out/native layout..."
          mkdir -p out/native/win-x64 out/native/win-arm64 out/native/linux-x64 out/native/linux-arm64 out/native/osx-arm64 out/native/osx-x64
          if [ -f release-assets/SkiaSharp.Static-win-x64.zip ]; then
            unzip -q release-assets/SkiaSharp.Static-win-x64.zip -d out/native/win-x64
          fi
          if [ -f release-assets/SkiaSharp.Static-win-arm64.zip ]; then
            unzip -q release-assets/SkiaSharp.Static-win-arm64.zip -d out/native/win-arm64
          fi
          if [ -f release-assets/SkiaSharp.Static-linux-x64.tar.gz ]; then
            tar -xzf release-assets/SkiaSharp.Static-linux-x64.tar.gz -C out/native/linux-x64
          fi
          if [ -f release-assets/SkiaSharp.Static-linux-arm64.tar.gz ]; then
            tar -xzf release-assets/SkiaSharp.Static-linux-arm64.tar.gz -C out/native/linux-arm64
          fi
          if [ -f release-assets/SkiaSharp.Static-osx.tar.gz ]; then
            tar -xzf release-assets/SkiaSharp.Static-osx.tar.gz -C out/native
          fi

      - name: List native binaries
        run: |
          echo "=== Native binaries layout ==="
          find out/native -type f || ls -R out/native

      - name: Pack NuGet Package
        run: |
          echo "Packing version: $PACKAGE_VER"
          dotnet pack nuget/SkiaSharp.Static/SkiaSharp.Static.csproj \
            -c Release \
            -p:PackageId="${{ inputs.package_id }}" \
            -p:Version="$PACKAGE_VER" \
            -p:NativeOutputDir="$(pwd)/out/native" \
            -o release-assets/

      - name: Create GitHub Release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TITLE="SkiaSharp.Static for Avalonia ${{ inputs.avalonia_version }} (SkiaSharp ${{ inputs.skiasharp_version }}) $PACKAGE_VER"

          NOTES=$(cat <<EOF
          ### Avalonia UI Static Native Libraries
          - **Avalonia Version**: \`${{ inputs.avalonia_version }}\`
          - **SkiaSharp Version**: \`${{ inputs.skiasharp_version }}\`
          - **HarfBuzzSharp Version**: \`${{ inputs.harfbuzz_version }}\`
          - **Package Version**: \`$PACKAGE_VER\`
          - **NuGet Package ID**: \`${{ inputs.package_id }}\`
          - **Supported Platforms**:
            - Windows x64 (\`win-x64\`)
            - Windows arm64 (\`win-arm64\`)
            - Linux x64 (\`linux-x64\`)
            - Linux arm64 (\`linux-arm64\`)
            - macOS Universal (\`osx-arm64\`, \`osx-x64\`)

          #### Usage with NativeAOT:
          Add the NuGet package reference to your Avalonia application project:
          \`\`\`xml
          <PackageReference Include="${{ inputs.package_id }}" Version="$PACKAGE_VER" />
          \`\`\`
          Publish with NativeAOT:
          \`\`\`bash
          dotnet publish -r win-x64 -c Release /p:PublishAot=true
          \`\`\`
          EOF
          )

          echo "=== Release Assets to upload ==="
          ls -lh release-assets/

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists, uploading assets..."
            gh release upload "$TAG_NAME" release-assets/* --clobber
          else
            echo "Creating release $TAG_NAME..."
            gh release create "$TAG_NAME" release-assets/* \
              --target "${{ github.sha }}" \
              --title "$RELEASE_TITLE" \
              --notes "$NOTES"
          fi

      - name: NuGet login (Trusted Publishing OIDC)
        if: ${{ inputs.publish_nuget }}
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER || inputs.nuget_user || 'Summpot' }}

      - name: Publish NuGet to NuGet.org
        if: ${{ inputs.publish_nuget }}
        run: |
          echo "=== Publishing NuGet packages to NuGet.org via Trusted Publishing ==="
          dotnet nuget push "release-assets/*.nupkg" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate

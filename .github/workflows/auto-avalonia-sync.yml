name: Auto - Avalonia Release

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      avalonia_version:
        description: Avalonia tag; leave empty for the latest release
        default: ''
        type: string
      revision:
        default: r1
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: staticavalonia-auto-release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.release.outputs.needed }}
      avalonia_version: ${{ steps.detect.outputs.avalonia_version }}
      harfbuzz_version: ${{ steps.detect.outputs.harfbuzz_version }}
      skiasharp_ref: ${{ steps.skia.outputs.commit }}
      skiasharp_tag: ${{ steps.skia.outputs.tag }}
      angle_tag: ${{ steps.angle.outputs.tag }}
      skia_exists: ${{ steps.skia.outputs.exists }}
      angle_exists: ${{ steps.angle.outputs.exists }}
    env:
      GH_TOKEN: ${{ github.token }}
      REVISION: ${{ inputs.revision || vars.STATICAVALONIA_REVISION || 'r1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: detect
        env:
          REQUESTED_AVALONIA: ${{ inputs.avalonia_version }}
        run: |
          AVALONIA_TAG="$REQUESTED_AVALONIA"
          if [ -z "$AVALONIA_TAG" ]; then
            AVALONIA_TAG=$(gh api repos/AvaloniaUI/Avalonia/releases/latest --jq .tag_name)
          fi
          python scripts/upstream.py detect "$AVALONIA_TAG" > out-versions.json
      - id: skia
        run: python scripts/artifacts.py plan --component skiasharp --ref "$(jq -r .skiasharp_ref out-versions.json)" --probe --output out/skiasharp-plan.json
      - id: angle
        run: python scripts/artifacts.py plan --component angle --probe --output out/angle-plan.json
      - id: release
        run: python scripts/artifacts.py release-plan --input out --avalonia "$(jq -r .avalonia_version out-versions.json)" --harfbuzz "$(jq -r .harfbuzz_version out-versions.json)" --revision "$REVISION"

  skiasharp:
    needs: plan
    if: needs.plan.outputs.needed == 'true' && needs.plan.outputs.skia_exists != 'true'
    uses: ./.github/workflows/build-skiasharp.yml
    with:
      skiasharp_ref: ${{ needs.plan.outputs.skiasharp_ref }}

  angle:
    needs: plan
    if: needs.plan.outputs.needed == 'true' && needs.plan.outputs.angle_exists != 'true'
    uses: ./.github/workflows/build-angle.yml

  package:
    needs: [plan, skiasharp, angle]
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.needed == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    uses: ./.github/workflows/package-staticavalonia.yml
    with:
      skiasharp_tag: ${{ needs.plan.outputs.skiasharp_tag }}
      angle_tag: ${{ needs.plan.outputs.angle_tag }}
      avalonia_version: ${{ needs.plan.outputs.avalonia_version }}
      harfbuzz_version: ${{ needs.plan.outputs.harfbuzz_version }}
      revision: ${{ inputs.revision || vars.STATICAVALONIA_REVISION || 'r1' }}

  publish:
    needs: package
    uses: ./.github/workflows/build-static-libs.yml
    with:
      package_tag: ${{ needs.package.outputs.package_tag }}

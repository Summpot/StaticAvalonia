name: Build - SkiaSharp Static Libraries

on:
  pull_request:
    paths:
      - .github/workflows/build-skiasharp.yml
      - scripts/upstream.py
      - native/static/**
      - patches/skiasharp/**
      - patches/skia/**
  workflow_dispatch:
    inputs:
      skiasharp_ref:
        description: Upstream SkiaSharp commit, tag, or branch
        type: string
        default: release/3.119.4
  workflow_call:
    inputs:
      skiasharp_ref:
        type: string
        default: release/3.119.4
    outputs:
      component_tag:
        value: ${{ jobs.plan.outputs.tag }}

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      commit: ${{ steps.plan.outputs.commit }}
      exists: ${{ steps.plan.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.skiasharp_ref || 'release/3.119.4' }}
        run: python scripts/artifacts.py plan --component skiasharp --ref "$SOURCE_REF" --probe --output out/component.json
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.exists != 'true'
        with:
          name: skiasharp-plan
          path: out/component.json

  build-windows:
    name: Windows ${{ matrix.arch }} (Static)
    needs: plan
    if: needs.plan.outputs.exists != 'true'
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            msvc_arch: x64
            msbuild_platform: x64
          # Cross-compile from the x64 runner. Skia GN selects HostX64/<target_cpu>/cl.exe.
          - arch: arm64
            msvc_arch: amd64_arm64
            msbuild_platform: ARM64
            platform_toolset: v143
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup depot_tools
        shell: pwsh
        run: |
          git clone --depth=1 --no-tags --single-branch https://chromium.googlesource.com/chromium/tools/depot_tools.git "$env:USERPROFILE\depot_tools"
          "$env:USERPROFILE\depot_tools" | Out-File -FilePath $env:GITHUB_PATH -Append
          "DEPOT_TOOLS_WIN_TOOLCHAIN=0" | Out-File -FilePath $env:GITHUB_ENV -Append
          $env:PATH = "$env:USERPROFILE\depot_tools;$env:PATH"
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global depot-tools.allowGlobalGitConfig true
          & "$env:USERPROFILE\depot_tools\update_depot_tools.bat"

      - name: Setup MSVC environment
        uses: TheMrMilchmann/setup-msvc-dev@v3
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Fetch SkiaSharp source
        shell: pwsh
        run: |
          $skiaRef = "${{ needs.plan.outputs.commit }}"
          Write-Host "Fetching SkiaSharp source from $skiaRef..."
          New-Item -ItemType Directory -Path "src_skiasharp" -Force | Out-Null
          Set-Location src_skiasharp
          git init
          git remote add upstream https://github.com/mono/SkiaSharp.git
          git fetch --depth 1 upstream "$skiaRef"
          git checkout -q FETCH_HEAD
          git submodule update --init --depth 1 externals/skia
          Set-Location ..

      - name: Sync Skia dependencies
        shell: pwsh
        run: |
          Set-Location src_skiasharp/externals/skia
          python tools/git-sync-deps
          Set-Location ../../

      - name: Apply source patches
        run: python scripts/upstream.py apply

      - name: Build Skia & SkiaSharp (Static)
        shell: pwsh
        run: |
          $buildDir = "out/win-${{ matrix.arch }}"
          New-Item -ItemType Directory -Path $buildDir -Force | Out-Null
          (Get-Content "native/static/args.win.gn") -replace 'target_cpu = "x64"', 'target_cpu = "${{ matrix.arch }}"' | Set-Content "$buildDir/args.gn" -Encoding ascii
          $buildDirAbs = (Resolve-Path $buildDir).Path
          Set-Location src_skiasharp/externals/skia
          gn gen "$buildDirAbs"
          autoninja -C "$buildDirAbs" skia SkiaSharp
          Set-Location ../../

      - name: Build libHarfBuzzSharp (Static)
        shell: pwsh
        run: |
          $buildDirAbs = (Resolve-Path "out/win-${{ matrix.arch }}").Path
          $msbuildArgs = @(
            "src_skiasharp/native/windows/libHarfBuzzSharp/libHarfBuzzSharp.vcxproj",
            "-m",
            "-t:rebuild",
            "-p:Configuration=Release",
            "-p:Platform=${{ matrix.msbuild_platform }}",
            "-p:ConfigurationType=StaticLibrary",
            "-p:OutDir=$buildDirAbs\"
          )
          $toolset = "${{ matrix.platform_toolset }}"
          if ($toolset) {
            $msbuildArgs += "-p:PlatformToolset=$toolset"
          }
          & msbuild @msbuildArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare Windows artifacts
        shell: pwsh
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          python -c @'
          import os, pathlib, sys
          arch = os.environ["ARCH"]
          expected = {"x64": 0x8664, "arm64": 0xAA64}[arch]
          known = {0x8664, 0xAA64, 0x14C, 0x1C0}
          for name in ("skia.lib", "SkiaSharp.lib", "libHarfBuzzSharp.lib"):
              data = pathlib.Path(f"out/win-{arch}", name).read_bytes()
              if not data.startswith(b"!<arch>\n"):
                  sys.exit(f"{name} is not a COFF archive")
              pos = 8
              machine = None
              while pos + 60 <= len(data):
                  header = data[pos:pos + 60]
                  member_name = header[:16].decode("ascii", "replace").strip()
                  size = int(header[48:58])
                  member = pos + 60
                  if member_name not in ("/", "//") and member + 8 <= len(data):
                      if data[member:member + 4] == b"\x00\x00\xff\xff":
                          candidate = int.from_bytes(data[member + 6:member + 8], "little")
                      else:
                          candidate = int.from_bytes(data[member:member + 2], "little")
                      if candidate in known:
                          machine = candidate
                          break
                  pos = member + size + (size % 2)
              if machine != expected:
                  sys.exit(f"{name} COFF machine {machine}, expected {expected:#x} for {arch}")
              print(f"{name} COFF machine {machine:#x} matches {arch}")
          '@
          $out = "out/win-$env:ARCH"
          New-Item -ItemType Directory -Path "artifacts/win-$env:ARCH" -Force | Out-Null
          Copy-Item "$out/skia.lib" "artifacts/win-$env:ARCH/"
          Copy-Item "$out/SkiaSharp.lib" "artifacts/win-$env:ARCH/"
          Copy-Item "$out/libHarfBuzzSharp.lib" "artifacts/win-$env:ARCH/"
          if (Test-Path "$out/libHarfBuzzSharp.pdb") {
            Copy-Item "$out/libHarfBuzzSharp.pdb" "artifacts/win-$env:ARCH/"
          }

      - name: Upload Windows native binaries
        uses: actions/upload-artifact@v4
        with:
          name: native-skiasharp-win-${{ matrix.arch }}
          path: artifacts/win-${{ matrix.arch }}/


  build-linux:
    name: Linux ${{ matrix.arch }} (Static)
    needs: plan
    if: needs.plan.outputs.exists != 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libc++-dev libc++abi-dev ninja-build libfontconfig1-dev libfreetype-dev

      - name: Setup depot_tools
        run: |
          git clone --depth=1 --no-tags --single-branch https://chromium.googlesource.com/chromium/tools/depot_tools.git "$HOME/depot_tools"
          echo "$HOME/depot_tools" >> $GITHUB_PATH
          export PATH="$HOME/depot_tools:$PATH"
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global depot-tools.allowGlobalGitConfig true
          update_depot_tools

      - name: Fetch SkiaSharp source
        run: |
          SKIA_REF="${{ needs.plan.outputs.commit }}"
          echo "Fetching SkiaSharp source from $SKIA_REF..."
          mkdir -p src_skiasharp
          cd src_skiasharp
          git init
          git remote add upstream https://github.com/mono/SkiaSharp.git
          git fetch --depth 1 upstream "$SKIA_REF"
          git checkout -q FETCH_HEAD
          git submodule update --init --depth 1 externals/skia
          cd ..

      - name: Sync Skia dependencies
        run: |
          cd src_skiasharp/externals/skia
          python tools/git-sync-deps
          cd ../..

      - name: Apply source patches
        run: python scripts/upstream.py apply

      - name: Build Skia, SkiaSharp & HarfBuzzSharp (Static)
        run: |
          mkdir -p "out/linux-${{ matrix.arch }}"
          sed "s/target_cpu = \"x64\"/target_cpu = \"${{ matrix.arch }}\"/" native/static/args.linux.gn > "out/linux-${{ matrix.arch }}/args.gn"
          BUILD_DIR=$(realpath "out/linux-${{ matrix.arch }}")
          cd src_skiasharp/externals/skia
          gn gen "$BUILD_DIR"
          autoninja -C "$BUILD_DIR" skia SkiaSharp HarfBuzzSharp
          cd ../..

      - name: Prepare Linux artifacts
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          python3 -c '
          import os, pathlib, sys
          arch = os.environ["ARCH"]
          data = pathlib.Path(f"out/linux-{arch}/libskia.a").read_bytes()
          index = data.find(b"\x7fELF")
          machine = int.from_bytes(data[index + 18:index + 20], "little") if index >= 0 else None
          expected = {"x64": 62, "arm64": 183}[arch]
          if machine != expected:
              sys.exit(f"libskia.a ELF machine {machine}, expected {expected}")
          print(f"libskia.a ELF machine {machine} matches {arch}")
          '
          mkdir -p "artifacts/linux-$ARCH"
          cp "out/linux-$ARCH/libskia.a" "artifacts/linux-$ARCH/"
          cp "out/linux-$ARCH/libSkiaSharp.a" "artifacts/linux-$ARCH/"
          cp "out/linux-$ARCH/libHarfBuzzSharp.a" "artifacts/linux-$ARCH/"

      - name: Upload Linux native binaries
        uses: actions/upload-artifact@v4
        with:
          name: native-skiasharp-linux-${{ matrix.arch }}
          path: artifacts/linux-${{ matrix.arch }}/


  build-macos:
    name: macOS arm64 & x64 (Static)
    needs: plan
    if: needs.plan.outputs.exists != 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup depot_tools
        run: |
          git clone --depth=1 --no-tags --single-branch https://chromium.googlesource.com/chromium/tools/depot_tools.git "$HOME/depot_tools"
          echo "$HOME/depot_tools" >> $GITHUB_PATH
          export PATH="$HOME/depot_tools:$PATH"
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global depot-tools.allowGlobalGitConfig true
          update_depot_tools

      - name: Fetch SkiaSharp source
        run: |
          SKIA_REF="${{ needs.plan.outputs.commit }}"
          echo "Fetching SkiaSharp source from $SKIA_REF..."
          mkdir -p src_skiasharp
          cd src_skiasharp
          git init
          git remote add upstream https://github.com/mono/SkiaSharp.git
          git fetch --depth 1 upstream "$SKIA_REF"
          git checkout -q FETCH_HEAD
          git submodule update --init --depth 1 externals/skia
          cd ..

      - name: Sync Skia dependencies
        run: |
          cd src_skiasharp/externals/skia
          python tools/git-sync-deps
          cd ../..

      - name: Apply source patches
        run: python scripts/upstream.py apply

      - name: Build macOS arm64 (Static)
        run: |
          mkdir -p out/osx-arm64
          cp native/static/args.mac.gn out/osx-arm64/args.gn
          BUILD_DIR=$(realpath out/osx-arm64)
          cd src_skiasharp/externals/skia
          gn gen "$BUILD_DIR"
          autoninja -C "$BUILD_DIR" skia SkiaSharp HarfBuzzSharp
          cd ../..

      - name: Build macOS x64 (Static)
        run: |
          mkdir -p out/osx-x64
          sed 's/target_cpu = "arm64"/target_cpu = "x64"/' native/static/args.mac.gn > out/osx-x64/args.gn
          BUILD_DIR=$(realpath out/osx-x64)
          cd src_skiasharp/externals/skia
          gn gen "$BUILD_DIR"
          autoninja -C "$BUILD_DIR" skia SkiaSharp HarfBuzzSharp
          cd ../..

      - name: Prepare macOS artifacts
        run: |
          mkdir -p artifacts/osx-arm64 artifacts/osx-x64
          cp out/osx-arm64/libskia.a artifacts/osx-arm64/
          cp out/osx-arm64/libSkiaSharp.a artifacts/osx-arm64/
          cp out/osx-arm64/libHarfBuzzSharp.a artifacts/osx-arm64/

          cp out/osx-x64/libskia.a artifacts/osx-x64/
          cp out/osx-x64/libSkiaSharp.a artifacts/osx-x64/
          cp out/osx-x64/libHarfBuzzSharp.a artifacts/osx-x64/


      - name: Upload macOS native binaries
        uses: actions/upload-artifact@v4
        with:
          name: native-skiasharp-osx
          path: artifacts/


  bundle:
    needs: [plan, build-windows, build-linux, build-macos]
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.exists != 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: component-${{ needs.plan.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: skiasharp-plan
          path: out
      - uses: actions/download-artifact@v4
        with:
          pattern: native-skiasharp-*
          path: out/incoming
      - name: Verify and bundle component
        run: python scripts/artifacts.py bundle --output out/component
      - uses: actions/upload-artifact@v4
        with:
          name: skiasharp-native
          path: out/component/
          if-no-files-found: error
      - name: Persist immutable component release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/artifacts.py store-component --output out/component

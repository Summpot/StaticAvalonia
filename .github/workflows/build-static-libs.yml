name: Publish - StaticAvalonia

on:
  workflow_dispatch:
    inputs:
      package_tag:
        description: Exact tested package-staticavalonia candidate release tag
        required: true
        type: string
      nuget_user:
        default: Summpot
        type: string
  workflow_call:
    inputs:
      package_tag:
        required: true
        type: string
      nuget_user:
        default: Summpot
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: staticavalonia-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - id: package
        name: Download and verify tested package
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_TAG: ${{ inputs.package_tag }}
        run: python scripts/artifacts.py fetch-package --tag "$PACKAGE_TAG" --output out/package
      - id: nuget
        name: Check existing NuGet content
        run: python scripts/artifacts.py check-nuget --output out/package
      - name: NuGet login
        if: steps.nuget.outputs.exists != 'true'
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ inputs.nuget_user }}
      - name: Publish the verified package
        if: steps.nuget.outputs.exists != 'true'
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          PACKAGE_FILE: ${{ steps.package.outputs.file }}
        run: dotnet nuget push "out/package/$PACKAGE_FILE" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
      - name: Confirm public NuGet package
        run: python scripts/artifacts.py wait-nuget --output out/package
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/artifacts.py release --output out/package
